#!/usr/sbin/nft -f

flush ruleset

table inet kiosk {
	chain input {
		type filter hook input priority filter; policy accept;

		iif "lo" accept
		ct state established,related accept

		# SSH and VNC are only reachable from the OpenVPN tunnel.
		tcp dport { 22, 5900 } iifname "tun*" accept
		tcp dport { 22, 5900 } drop
	}
}
